name: CI
on:
  push:
    branches: ["main","feat/**","fix/**","hardening/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_market_soak:
        description: "Run the opt-in live Binance public market-data evidence soak"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run security:secrets
      - run: npm audit --audit-level=high

  postgres-integration:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      TRADING_NOVA_REAL_DB_TEST: "1"
      TRADING_NOVA_SKIP_AUDIT_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Require Neon secret
        shell: bash
        run: test -n "${POSTGRES_URL}"
      - run: npm run db:migrate
      - run: node --test tests/postgres.integration.test.js

  postgres-audit-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: trading_nova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trading_nova"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/trading_nova
      TRADING_NOVA_REAL_DB_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run db:migrate
      - run: node --test tests/postgres.integration.test.js

  recovery-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: trading_nova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trading_nova"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/trading_nova
      POSTGRES_RESTORE_URL: postgresql://postgres@127.0.0.1:5432/trading_nova_restore
      BACKUP_FILE: /tmp/trading-nova-backup.dump
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run db:migrate
      - run: node scripts/seed-recovery-drill.js
      - run: npm run recovery:drill

  market-data-evidence:
    if: github.event_name == 'workflow_dispatch' && inputs.run_market_soak == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MARKET_BINANCE_BASE_URL: "https://api.binance.us"
      MARKET_SOAK_DURATION_MS: "120000"
      MARKET_SOAK_INTERVAL_MS: "5000"
      MARKET_REQUEST_TIMEOUT_MS: "5000"
      MARKET_REQUEST_DEADLINE_MS: "15000"
      MARKET_MAX_ERROR_RATE: "0.05"
      MARKET_MAX_LATENCY_MS: "2000"
      MARKET_MAX_AGE_MS: "120000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Run public Binance market-data evidence soak
        run: npm run market:soak

  phase5-stress-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOVA_PORT: "7411"
      STRESS_TEST_DURATION_MS: "30000"
      STRESS_TEST_RPS: "100"
      STRESS_TEST_CONCURRENCY: "20"
      STRESS_TEST_REQUEST_TIMEOUT_MS: "5000"
      STRESS_TEST_MAX_ERROR_RATE: "0.01"
      STRESS_TEST_MAX_P95_MS: "500"
      STRESS_TEST_MAX_RSS_GROWTH_MB: "128"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Start loopback-only paper server
        shell: bash
        run: |
          nohup npm run serve >/tmp/trading-nova-server.log 2>&1 &
          for i in {1..50}; do
            if curl --fail --silent http://127.0.0.1:7411/api/health >/dev/null; then exit 0; fi
            sleep 0.2
          done
          cat /tmp/trading-nova-server.log
          exit 1
      - name: Stress health endpoint
        env:
          STRESS_TEST_URL: http://127.0.0.1:7411/api/health
        run: npm run stress:test
      - name: Stress portfolio endpoint
        env:
          STRESS_TEST_URL: http://127.0.0.1:7411/api/portfolio
        run: npm run stress:test
      - name: Stress journal endpoint
        env:
          STRESS_TEST_URL: http://127.0.0.1:7411/api/journal
        run: npm run stress:test
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/trading-nova-server.log

  neon-postgres:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Create isolated Neon test schema
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: node scripts/neon-ci-schema.js prepare
      - name: Apply migrations to isolated Neon schema
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          TRADING_NOVA_DB_SCHEMA: ${{ env.TRADING_NOVA_DB_SCHEMA }}
        run: node scripts/migrate.js
      - name: Run real Neon PostgreSQL integration tests
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          TRADING_NOVA_DB_SCHEMA: ${{ env.TRADING_NOVA_DB_SCHEMA }}
          TRADING_NOVA_REAL_DB_TEST: "1"
        run: node scripts/neon-ci-test.js
      - name: Verify Neon-backed server startup and readiness
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          TRADING_NOVA_DB_SCHEMA: ${{ env.TRADING_NOVA_DB_SCHEMA }}
        run: node scripts/neon-ci-readiness.js
      - name: Remove isolated Neon test schema
        if: always() && env.TRADING_NOVA_DB_SCHEMA != ''
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          TRADING_NOVA_DB_SCHEMA: ${{ env.TRADING_NOVA_DB_SCHEMA }}
        run: node scripts/neon-ci-schema.js cleanup
