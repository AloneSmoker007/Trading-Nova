name: CI
on:
  push:
    branches: ["main","feat/**","fix/**","hardening/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_market_soak:
        description: "Run the opt-in live Binance public market-data evidence soak"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run security:secrets

  postgres-integration:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      TRADING_NOVA_REAL_DB_TEST: "1"
      TRADING_NOVA_SKIP_AUDIT_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Require Neon secret
        shell: bash
        run: test -n "${POSTGRES_URL}"
      - run: npm run db:migrate
      - run: node --test tests/postgres.integration.test.js

  postgres-audit-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: trading_nova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trading_nova"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/trading_nova
      TRADING_NOVA_REAL_DB_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run db:migrate
      - run: node --test tests/postgres.integration.test.js

  recovery-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: trading_nova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trading_nova"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/trading_nova
      POSTGRES_RESTORE_URL: postgresql://postgres@127.0.0.1:5432/trading_nova_restore
      BACKUP_FILE: /tmp/trading-nova-backup.dump
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run db:migrate
      - run: node scripts/seed-recovery-drill.js
      - run: npm run recovery:drill

  market-data-evidence:
    if: github.event_name == 'workflow_dispatch' && inputs.run_market_soak == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MARKET_SOAK_DURATION_MS: "120000"
      MARKET_SOAK_INTERVAL_MS: "5000"
      MARKET_REQUEST_TIMEOUT_MS: "5000"
      MARKET_REQUEST_DEADLINE_MS: "15000"
      MARKET_MAX_ERROR_RATE: "0.05"
      MARKET_MAX_LATENCY_MS: "2000"
      MARKET_MAX_AGE_MS: "120000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Run public Binance market-data evidence soak
        run: npm run market:soak
