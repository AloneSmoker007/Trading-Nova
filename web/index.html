<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trading Nova</title><style>body{font-family:system-ui;margin:0;background:#0b1020;color:#eef}main{max-width:1100px;margin:auto;padding:32px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#151c32;border:1px solid #293250;border-radius:14px;padding:18px}.muted{color:#9aa6c2}.status{font-size:28px;font-weight:700}</style></head><body><main><h1>Trading Nova</h1><p class="muted">Research → evidence → validation → risk → paper/shadow. Live trading stays human-controlled.</p><section class="grid"><div class="card"><div class="muted">Market</div><div id="market" class="status">NO DATA</div></div><div class="card"><div class="muted">Opportunity</div><div id="opportunity" class="status">WAIT</div></div><div class="card"><div class="muted">Risk Gate</div><div id="risk" class="status">UNKNOWN</div></div><div class="card"><div class="muted">Execution</div><div id="execution" class="status">PAPER</div></div></section><section class="card" style="margin-top:16px"><h2>Safety</h2><p id="safety" class="muted">No live-money capability is implied by this UI.</p></section></main><script>window.TRADING_NOVA_UI={setState(s){for(const[k,v]of Object.entries(s)){const e=document.getElementById(k);if(e)e.textContent=String(v)}}};</script></body></html>
